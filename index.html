<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIBSSA TV | منصة البث المباشر والترفيه</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00d2ff">
    <!-- خط Cairo العربي من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.4);
            --accent: #ff0055;
            --bg: #07090e;
            --card-bg: rgba(18, 22, 32, 0.75);
            --card-hover: rgba(26, 32, 48, 0.9);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f4f8;
            --text-muted: #8b95a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 210, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 85, 0.04) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            padding-bottom: 90px;
            min-height: 100vh;
        }

        /* ===== Header ===== */
        header {
            background: rgba(11, 14, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 14px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header h1 span {
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ===== Player Box ===== */
        .player-wrapper {
            margin: 20px auto 12px auto;
            max-width: 950px;
        }

        .player-container {
            width: 100%;
            background: #000;
            aspect-ratio: 16/9;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 210, 255, 0.2);
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 210, 255, 0.15);
        }

        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }

        .player-placeholder {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted);
            gap: 12px;
            background: radial-gradient(circle, rgba(20,26,38,1) 0%, rgba(7,9,14,1) 100%);
        }

        .player-placeholder p {
            font-weight: 700;
            font-size: 15px;
            color: var(--primary);
        }

        /* ===== VLC & Actions Bar ===== */
        .vlc-bar {
            max-width: 950px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
        }

        .vlc-btn {
            background: linear-gradient(135deg, #ff7b00, #e65100);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(230, 81, 0, 0.3);
            transition: all 0.3s ease;
        }

        .vlc-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 81, 0, 0.5);
        }

        /* ===== Tabs ===== */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 24px 0;
            background: rgba(15, 20, 30, 0.6);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid var(--border);
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 18px var(--primary-glow);
        }

        /* ===== Filter & Search Bar ===== */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 22px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar select, .search-box {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .filter-bar select {
            flex: 1;
            min-width: 150px;
            cursor: pointer;
        }

        .search-box {
            flex: 2;
            min-width: 200px;
        }

        .filter-bar select:focus, .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        /* ===== Cards Grid ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 16px;
        }

        .movie-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            border-color: var(--primary);
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px var(--primary-glow);
            background: var(--card-hover);
        }

        .movie-card .img-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
            background: #0d1117;
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .movie-card:hover img {
            transform: scale(1.08);
        }

        .movie-card h4 {
            font-size: 13px;
            font-weight: 700;
            margin-top: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        /* ===== Live Matches Cards ===== */
        .matches-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .match-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .match-card:hover {
            border-color: var(--primary);
            background: var(--card-hover);
            transform: translateX(-4px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 12px var(--primary-glow);
        }

        .match-card .info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .match-card img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border: 1px solid var(--border);
        }

        .team {
            font-weight: 800;
            font-size: 15px;
            color: #fff;
        }

        .status {
            background: rgba(255, 0, 85, 0.15);
            color: var(--accent);
            border: 1px solid rgba(255, 0, 85, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status::before {
            content: '';
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* ===== Episodes View ===== */
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 16px;
        }

        .episode-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            transition: all 0.2s ease;
        }

        .episode-btn:hover {
            border-color: var(--primary);
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .episode-btn small {
            display: block;
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 2px;
            font-weight: 400;
        }

        .episode-btn:hover small {
            color: #222;
        }

        .back-btn {
            background: var(--card-bg);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 800;
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* ===== Bottom Mobile Nav ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 14, 22, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
        }

        /* ===== Loading & Empty States ===== */
        .loading, .empty, .error {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
            font-weight: 700;
            font-size: 15px;
        }

        .error {
            color: #ff4757;
        }

        /* ===== Responsive Media Queries ===== */
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 10px;
            }
            .movie-card .img-wrapper {
                height: 155px;
            }
            .match-card {
                padding: 12px 14px;
            }
            .team {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1><span>BIBSSA</span> TV 📺</h1>
    </header>

    <div class="container">
        <!-- Player Container -->
        <div class="player-wrapper">
            <div class="player-container" id="player-box">
                <div class="player-placeholder">
                    <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3" fill="var(--primary)"></polygon></svg>
                    <p>اختر قناة أو فيلماً لبدء التشغيل الفوري</p>
                </div>
            </div>
        </div>

        <!-- External Player Bar -->
        <div class="vlc-bar">
            <a id="vlc-link" href="#" target="_blank" class="vlc-btn" style="display:none;">
                🍊 فتح البث في مشغل VLC الخارجي
            </a>
        </div>

        <!-- Main Category Tabs -->
        <div class="tabs">
            <button class="tab-btn active" id="tab-sports" onclick="switchTab('sports')">⚽ المباشر</button>
            <button class="tab-btn" id="tab-cinema" onclick="switchTab('cinema')">🎬 الأفلام</button>
            <button class="tab-btn" id="tab-series" onclick="switchTab('series')">📺 المسلسلات</button>
        </div>

        <!-- Section: Live / Sports -->
        <div id="sports-sec">
            <div class="filter-bar">
                <select id="sports-cat" onchange="loadMatches()"></select>
                <input class="search-box" id="sports-search" placeholder="🔍 بحث عن قناة أو مباراة..." oninput="filterMatches()">
            </div>
            <div id="matches-list" class="loading">جاري تحميل البث المباشر والقنوات...</div>
        </div>

        <!-- Section: Movies -->
        <div id="cinema-sec" style="display: none;">
            <div class="filter-bar">
                <select id="movies-cat" onchange="loadMovies()"></select>
                <input class="search-box" id="movies-search" placeholder="🔍 بحث في مكتبة الأفلام..." oninput="filterMovies()">
            </div>
            <div class="grid" id="movies-grid"></div>
        </div>

        <!-- Section: Series -->
        <div id="series-sec" style="display: none;">
            <div class="filter-bar">
                <select id="series-cat" onchange="loadSeries()"></select>
                <input class="search-box" id="series-search" placeholder="🔍 بحث في مكتبة المسلسلات..." oninput="filterSeries()">
            </div>
            <div id="series-view">
                <div class="grid" id="series-grid"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-sports" onclick="switchTab('sports')">
            <span>⚽</span>
            <span>المباشر</span>
        </div>
        <div class="nav-item" id="nav-cinema" onclick="switchTab('cinema')">
            <span>🎬</span>
            <span>الأفلام</span>
        </div>
        <div class="nav-item" id="nav-series" onclick="switchTab('series')">
            <span>📺</span>
            <span>المسلسلات</span>
        </div>
    </div>

    <script>
        // رابط سيرفر Render المباشر
        const API_BASE_URL = "https://bibssa-tv.onrender.com";

        const playerBox = document.getElementById('player-box');
        const vlcLink = document.getElementById('vlc-link');
        let hls = null;
        let allMatches = [], allMovies = [], allSeries = [];

        // ===== التشغيل عبر البروكسي =====
        async function playMedia(streamUrl) {
            playerBox.innerHTML = `
                <div class="player-placeholder">
                    <p style="color:var(--primary)">جاري تجهيز وتظبيط البث...</p>
                </div>`;
            
            vlcLink.style.display = 'none';
            const proxyUrl = `${API_BASE_URL}/proxy?url=${encodeURIComponent(streamUrl)}`;

            vlcLink.href = `vlc://${streamUrl}`;
            vlcLink.style.display = 'inline-flex';

            playerBox.innerHTML = '<video id="video" controls autoplay playsinline></video>';
            const video = document.getElementById('video');

            if (hls) hls.destroy();

            if (Hls.isSupported() && (streamUrl.includes('.m3u8') || streamUrl.includes('.ts'))) {
                hls = new Hls();
                hls.loadSource(proxyUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                hls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal) { hls.destroy(); video.src = proxyUrl; video.play(); }
                });
            } else {
                video.src = proxyUrl;
                video.play();
            }

            // التمرير التلقائي للشاشة نحو المشغل
            playerBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ===== التبويبات =====
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn, .nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById('sports-sec').style.display = tab === 'sports' ? 'block' : 'none';
            document.getElementById('cinema-sec').style.display = tab === 'cinema' ? 'block' : 'none';
            document.getElementById('series-sec').style.display = tab === 'series' ? 'block' : 'none';
            
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('nav-' + tab).classList.add('active');

            if (tab === 'sports') loadMatches();
            else if (tab === 'cinema') loadMovies();
            else loadSeries();
        }

        // ===== الفئات =====
        async function loadCategories(kind, selectId) {
            try {
                const res = await fetch(`${API_BASE_URL}/api/categories/${kind}`);
                const data = await res.json();
                const sel = document.getElementById(selectId);
                sel.innerHTML = '<option value="">كل الفئات والتصنيفات</option>' + (data.data || []).map(c =>
                    `<option value="${c.category_id}">${c.category_name}</option>`).join('');
            } catch {}
        }

        // ===== المباريات / القنوات المباشرة =====
        async function loadMatches() {
            const cat = document.getElementById('sports-cat').value;
            const container = document.getElementById('matches-list');
            container.className = 'loading';
            container.innerHTML = 'جاري تحضير البث المباشر...';
            try {
                const res = await fetch(`${API_BASE_URL}/api/matches${cat ? '?category_id=' + cat : ''}`);
                const data = await res.json();
                allMatches = data.data || [];
                renderMatches();
            } catch {
                container.className = 'error';
                container.innerHTML = 'حدث خطأ أثناء جلب القنوات، يرجى المحاولة لاحقاً.';
            }
        }

        function renderMatches() {
            const container = document.getElementById('matches-list');
            const q = (document.getElementById('sports-search').value || '').toLowerCase();
            const list = allMatches.filter(m => !q || m.home_team.toLowerCase().includes(q));
            
            if (list.length === 0) {
                container.className = 'empty';
                container.innerHTML = 'لا توجد قنوات مطابقة لنتائج البحث';
                return;
            }
            container.className = 'matches-container';
            container.innerHTML = list.map(m => `
                <div class="match-card" onclick="playMedia('${m.stream_url}')">
                    <div class="info">
                        <img src="${m.logo || ''}" onerror="this.src='https://via.placeholder.com/42/0d1117/00d2ff?text=TV'"/>
                        <span class="team">${m.home_team}</span>
                    </div>
                    <span class="status">${m.status}</span>
                </div>
            `).join('');
        }

        function filterMatches() { renderMatches(); }

        // ===== الأفلام =====
        async function loadMovies() {
            const cat = document.getElementById('movies-cat').value;
            const grid = document.getElementById('movies-grid');
            grid.className = 'loading';
            grid.innerHTML = 'جاري تحميل قائمة الأفلام...';
            try {
                const res = await fetch(`${API_BASE_URL}/api/movies${cat ? '?category_id=' + cat : ''}`);
                const data = await res.json();
                allMovies = data.data || [];
                renderMovies();
            } catch {
                grid.className = 'error';
                grid.innerHTML = 'حدث خطأ في تحميل الأفلام.';
            }
        }

        function renderMovies() {
            const grid = document.getElementById('movies-grid');
            const q = (document.getElementById('movies-search').value || '').toLowerCase();
            const list = allMovies.filter(m => !q || m.title.toLowerCase().includes(q));
            
            if (list.length === 0) {
                grid.className = 'empty';
                grid.innerHTML = 'لا توجد أفلام مطابقة لنتائج البحث';
                return;
            }
            grid.className = 'grid';
            grid.innerHTML = list.map(m => `
                <div class="movie-card" onclick="playMedia('${m.stream_url}')">
                    <div class="img-wrapper">
                        <img src="${m.poster || ''}" onerror="this.src='https://via.placeholder.com/150x220/0d1117/00d2ff?text=No+Cover'"/>
                    </div>
                    <h4>${m.title}</h4>
                </div>
            `).join('');
        }

        function filterMovies() { renderMovies(); }

        // ===== المسلسلات =====
        async function loadSeries() {
            const cat = document.getElementById('series-cat').value;
            const grid = document.getElementById('series-grid');
            grid.className = 'loading';
            grid.innerHTML = 'جاري تحميل قائمة المسلسلات...';
            try {
                const res = await fetch(`${API_BASE_URL}/api/series${cat ? '?category_id=' + cat : ''}`);
                const data = await res.json();
                allSeries = data.data || [];
                renderSeries();
            } catch {
                grid.className = 'error';
                grid.innerHTML = 'حدث خطأ في تحميل المسلسلات.';
            }
        }

        function renderSeries() {
            const grid = document.getElementById('series-grid');
            const q = (document.getElementById('series-search').value || '').toLowerCase();
            const list = allSeries.filter(s => !q || s.title.toLowerCase().includes(q));
            
            if (list.length === 0) {
                grid.className = 'empty';
                grid.innerHTML = 'لا توجد مسلسلات مطابقة لنتائج البحث';
                return;
            }
            grid.className = 'grid';
            grid.innerHTML = list.map(s => `
                <div class="movie-card" onclick="openSeries(${s.id}, '${s.title.replace(/'/g, "\\'")}')">
                    <div class="img-wrapper">
                        <img src="${s.poster || ''}" onerror="this.src='https://via.placeholder.com/150x220/0d1117/00d2ff?text=No+Cover'"/>
                    </div>
                    <h4>${s.title}</h4>
                </div>
            `).join('');
        }

        function filterSeries() { renderSeries(); }

        // ===== حلقات المسلسل =====
        async function openSeries(id, title) {
            const view = document.getElementById('series-view');
            view.innerHTML = '<div class="loading">جاري تحميل الحلقات...</div>';
            try {
                const res = await fetch(`${API_BASE_URL}/api/series/${id}/episodes`);
                const data = await res.json();
                view.innerHTML = `
                    <button class="back-btn" onclick="backToSeries()">← العودة لقائمة المسلسلات</button>
                    <h3 style="margin-bottom:14px;color:var(--primary);font-size:18px;">${title}</h3>
                    <div class="episode-grid">
                        ${(data.data || []).map(e => `
                            <button class="episode-btn" onclick="playMedia('${e.stream_url}')">
                                الحلقة ${e.episode}
                                <small>الموسم ${e.season}</small>
                            </button>
                        `).join('')}
                    </div>`;
            } catch {
                view.innerHTML = '<div class="error">خطأ أثناء جلب حلقات هذا المسلسل</div>';
            }
        }

        function backToSeries() {
            document.getElementById('series-view').innerHTML =
                '<div class="grid" id="series-grid"></div>';
            loadSeries();
        }

        // ===== التهيئة عند التشغيل =====
        loadCategories('live', 'sports-cat');
        loadCategories('movies', 'movies-cat');
        loadCategories('series', 'series-cat');
        loadMatches();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
