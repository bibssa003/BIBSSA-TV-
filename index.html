<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIBSSA TV | البث المباشر والترفيه</title>
    <!-- تم تصحيح المسار إلى نسبي ./ بدلاً من / لتفادي خطأ 404 -->
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-nav">
        <div class="logo">📺 BIBSSA TV</div>
    </header>

    <main class="container">
        <!-- مشغل الفيديو -->
        <div class="player-container">
            <video id="mainPlayer" controls autoplay style="width:100%; max-height:400px; background:#000;"></video>
            <div id="vlcBtnContainer" style="margin-top: 10px; display:none;">
                <a id="vlcLink" href="#" class="vlc-btn" style="background:#f39c12; color:#fff; padding:8px 15px; text-decoration:none; border-radius:5px; display:inline-block;">
                    🍊 فتح البث في مشغل VLC الخارجي
                </a>
            </div>
        </div>

        <!-- أزرار التنقل بين الأقسام -->
        <div class="tabs" style="margin: 20px 0; text-align:center;">
            <button onclick="switchTab('live')" class="tab-btn active">⚽ المباشر</button>
            <button onclick="switchTab('movies')" class="tab-btn">🎬 الأفلام</button>
            <button onclick="switchTab('series')" class="tab-btn">📺 المسلسلات</button>
        </div>

        <!-- أدوات البحث والتصفية -->
        <div class="controls" style="display:flex; gap:10px; margin-bottom:20px;">
            <input type="text" id="searchInput" oninput="filterContent()" placeholder="بحث عن قناة أو فيلم..." style="flex:1; padding:8px;">
            <select id="categorySelect" onchange="filterContent()" style="padding:8px;">
                <option value="all">كل الفئات والتصنيفات</option>
            </select>
        </div>

        <!-- قائمة عرض العناصر -->
        <div id="contentGrid" class="grid-container">
            <!-- يتم تحميل البيانات هنا ديناميكياً -->
        </div>
    </main>

    <script>
        const API_BASE_URL = "https://bibssa-tv.onrender.com";
        let currentData = [];
        let activeTab = "live";

        // استدعاء البيانات عند فتح الصفحة فوراً
        document.addEventListener("DOMContentLoaded", () => {
            loadContent("live");
        });

        async function switchTab(tab) {
            activeTab = tab;
            await loadContent(tab);
        }

        async function loadContent(type) {
            const grid = document.getElementById("contentGrid");
            grid.innerHTML = "<p style='color:#fff; text-align:center;'>جاري تحميل البيانات...</p>";
            
            let endpoint = "/api/matches";
            if (type === "movies") endpoint = "/api/movies";
            if (type === "series") endpoint = "/api/series";

            try {
                const response = await fetch(`${API_BASE_URL}${endpoint}`);
                if (!response.ok) throw new Error("Network error");
                
                currentData = await response.json();
                renderItems(currentData);
            } catch (error) {
                console.error("Error fetching data:", error);
                grid.innerHTML = "<p style='color:red; text-align:center;'>حدث خطأ أثناء جلب البيانات. يرجى المحاولة لاحقاً.</p>";
            }
        }

        function renderItems(items) {
            const grid = document.getElementById("contentGrid");
            grid.innerHTML = "";

            if (!items || items.length === 0) {
                grid.innerHTML = "<p style='color:#ccc; text-align:center;'>لا توجد قنوات مطابقة لنتائج البحث</p>";
                return;
            }

            items.forEach(item => {
                const card = document.createElement("div");
                card.style.cssText = "background:#1e293b; color:#fff; padding:15px; border-radius:8px; cursor:pointer; margin-bottom:10px;";
                card.innerText = item.title;
                card.onclick = () => playStream(item.stream_url);
                grid.appendChild(card);
            });
        }

        function playStream(url) {
            if (!url) return;
            const player = document.getElementById("mainPlayer");
            player.src = url;
            player.play();

            // إظهار زر VLC
            const vlcContainer = document.getElementById("vlcBtnContainer");
            const vlcLink = document.getElementById("vlcLink");
            vlcLink.href = `vlc://${url}`;
            vlcContainer.style.display = "block";
        }

        function filterContent() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = currentData.filter(item => item.title.toLowerCase().includes(query));
            renderItems(filtered);
        }
    </script>
</body>
</html>
