<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIBSSA TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 15px; text-align: center; }
        h1 { color: #38bdf8; margin-bottom: 15px; }
        
        .player-container { width: 100%; max-width: 800px; margin: 0 auto 20px; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; height: 280px; display: block; }
        
        .nav-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .nav-btn { padding: 10px 20px; background: #334155; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .nav-btn.active { background: #0284c7; }
        
        .controls-container { max-width: 800px; margin: 0 auto 15px; }
        select { width: 100%; padding: 12px; border-radius: 8px; background: #1e293b; color: #fff; border: 1px solid #334155; }
        
        .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-width: 800px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 10px; padding: 8px; cursor: pointer; text-align: center; }
        .card:hover { background: #334155; }
        .card img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; }
        .card h4 { font-size: 12px; margin-top: 8px; color: #e2e8f0; line-height: 1.2; }
        .message { grid-column: 1/-1; color: #94a3b8; padding: 20px; }
    </style>
</head>
<body>

    <h1>📺 BIBSSA TV</h1>

    <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="nav-buttons">
        <button class="nav-btn active" id="btnLive" onclick="switchMode('live')">📡 القنوات المباشرة</button>
        <button class="nav-btn" id="btnMovies" onclick="switchMode('movies')">🎬 الأفلام</button>
    </div>

    <div class="controls-container">
        <select id="categorySelect" onchange="onCategoryChange()">
            <option value="">جميع التصنيفات</option>
        </select>
    </div>

    <div class="content-grid" id="grid">
        <div class="message">جاري التحميل...</div>
    </div>

    <script>
        const API_BASE_URL = "https://bibssa-tv.onrender.com";
        const video = document.getElementById('videoPlayer');
        let currentMode = 'live';
        let hls = null;

        function playStream(url) {
            if (hls) { hls.destroy(); }
            if (Hls.isSupported() && url.includes('.m3u8')) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = url;
                video.play();
            }
        }

        async function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btnLive').classList.toggle('active', mode === 'live');
            document.getElementById('btnMovies').classList.toggle('active', mode === 'movies');
            await loadCategories();
            await loadItems();
        }

        async function loadCategories() {
            const select = document.getElementById('categorySelect');
            select.innerHTML = '<option value="">جميع التصنيفات</option>';
            const endpoint = currentMode === 'live' ? '/api/categories' : '/api/movie-categories';
            try {
                const res = await fetch(`${API_BASE_URL}${endpoint}`);
                const categories = await res.json();
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.category_id;
                    opt.textContent = cat.category_name;
                    select.appendChild(opt);
                });
            } catch (err) { console.error(err); }
        }

        async function loadItems(catId = '') {
            const grid = document.getElementById('grid');
            grid.innerHTML = '<div class="message">جاري جلب المحتوى...</div>';
            const endpoint = currentMode === 'live' ? '/api/channels' : '/api/movies';
            let url = `${API_BASE_URL}${endpoint}`;
            if (catId) url += `?category_id=${catId}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                grid.innerHTML = '';
                
                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="message">لا يتوفر محتوى في هذا التصنيف حالياً</div>';
                    return;
                }

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => playStream(item.stream_url);
                    const defaultImg = 'https://via.placeholder.com/150x100?text=BIBSSA+TV';
                    
                    card.innerHTML = `
                        <img src="${item.poster || defaultImg}" onerror="this.src='${defaultImg}'">
                        <h4>${item.title}</h4>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                grid.innerHTML = '<div class="message" style="color:#f87171;">حدث خطأ أثناء الإتصال بالسيرفر!</div>';
            }
        }

        function onCategoryChange() {
            loadItems(document.getElementById('categorySelect').value);
        }

        switchMode('live');
    </script>
</body>
</html>
