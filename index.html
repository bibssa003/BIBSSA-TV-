<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BIBSSA TV</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            padding: 15px;
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 32px;
        }

        .player-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 20px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 400px;
            display: block;
            background: #000;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .nav-btn {
            padding: 11px 20px;
            background: #334155;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .nav-btn:hover {
            background: #475569;
        }

        .nav-btn.active {
            background: #0284c7;
        }

        .controls-container {
            max-width: 900px;
            margin: 0 auto 15px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            font-size: 14px;
            cursor: pointer;
        }

        .search-container {
            max-width: 900px;
            margin: 0 auto 15px;
        }

        #searchInput {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            outline: none;
        }

        #searchInput::placeholder {
            color: #94a3b8;
        }

        .content-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(140px, 1fr)
                );

            gap: 12px;

            max-width: 900px;

            margin: 0 auto;
        }

        .card {
            background: #1e293b;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
            overflow: hidden;
        }

        .card:hover {
            background: #334155;
            transform: translateY(-3px);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            background: #111827;
        }

        .card h4 {
            font-size: 13px;
            margin-top: 8px;
            color: #e2e8f0;
            line-height: 1.3;
            word-break: break-word;
        }

        .card small {
            display: block;
            margin-top: 5px;
            color: #94a3b8;
        }

        .message {
            grid-column: 1 / -1;
            color: #94a3b8;
            padding: 25px;
            font-size: 15px;
        }

        .error {
            color: #f87171;
        }

        .back-btn {
            background: #475569;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .series-info {
            max-width: 900px;
            margin: 0 auto 20px;
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            text-align: right;
        }

        .series-info h2 {
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .series-info p {
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 14px;
        }

        .season-title {
            max-width: 900px;
            margin: 20px auto 10px;
            text-align: right;
            color: #38bdf8;
            font-size: 20px;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            h1 {
                font-size: 25px;
            }

            video {
                height: 230px;
            }

            .content-grid {
                grid-template-columns:
                    repeat(
                        auto-fill,
                        minmax(110px, 1fr)
                    );

                gap: 8px;
            }

            .card img {
                height: 120px;
            }

        }

    </style>

</head>

<body>

    <h1>📺 BIBSSA TV</h1>

    <!-- PLAYER -->

    <div class="player-container">

        <video
            id="videoPlayer"
            controls
            playsinline
        ></video>

    </div>

    <!-- NAVIGATION -->

    <div class="nav-buttons">

        <button
            class="nav-btn active"
            id="btnLive"
            onclick="switchMode('live')"
        >
            📡 القنوات المباشرة
        </button>

        <button
            class="nav-btn"
            id="btnMovies"
            onclick="switchMode('movies')"
        >
            🎬 الأفلام
        </button>

        <button
            class="nav-btn"
            id="btnSeries"
            onclick="switchMode('series')"
        >
            📺 المسلسلات
        </button>

    </div>

    <!-- CATEGORY -->

    <div
        class="controls-container"
        id="categoryContainer"
    >

        <select
            id="categorySelect"
            onchange="onCategoryChange()"
        >

            <option value="">
                جميع التصنيفات
            </option>

        </select>

    </div>

    <!-- SEARCH -->

    <div class="search-container">

        <input
            id="searchInput"
            type="text"
            placeholder="🔎 ابحث عن قناة أو فيلم أو مسلسل..."
            oninput="filterItems()"
        >

    </div>

    <!-- CONTENT -->

    <div
        class="content-grid"
        id="grid"
    >

        <div class="message">
            جاري التحميل...
        </div>

    </div>


<script>

    // =====================================================
    // CONFIG
    // =====================================================

    const API_BASE_URL =
        "https://bibssa-tv.onrender.com";


    const video =
        document.getElementById(
            "videoPlayer"
        );


    const grid =
        document.getElementById(
            "grid"
        );


    const categorySelect =
        document.getElementById(
            "categorySelect"
        );


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    let currentMode = "live";

    let currentItems = [];

    let hls = null;


    // =====================================================
    // DEFAULT IMAGE
    // =====================================================

    const defaultImage =
        "https://via.placeholder.com/300x180?text=BIBSSA+TV";


    // =====================================================
    // PLAY STREAM
    // =====================================================

    function playStream(url) {

        if (!url) {
            return;
        }

        if (hls) {

            hls.destroy();

            hls = null;
        }


        const fullUrl =
            url.startsWith("http")
                ? url
                : API_BASE_URL + url;


        // HLS.js

        if (
            fullUrl.includes(".m3u8") &&
            Hls.isSupported()
        ) {

            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true
            });


            hls.loadSource(
                fullUrl
            );


            hls.attachMedia(
                video
            );


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function() {

                    video.play()
                        .catch(() => {});

                }
            );


            hls.on(
                Hls.Events.ERROR,
                function(
                    event,
                    data
                ) {

                    console.error(
                        "HLS Error:",
                        data
                    );

                }
            );

        }

        // Native HLS

        else {

            video.src =
                fullUrl;

            video.play()
                .catch(() => {});

        }

    }


    // =====================================================
    // SWITCH MODE
    // =====================================================

    async function switchMode(
        mode
    ) {

        currentMode =
            mode;


        document
            .getElementById(
                "btnLive"
            )
            .classList
            .toggle(
                "active",
                mode === "live"
            );


        document
            .getElementById(
                "btnMovies"
            )
            .classList
            .toggle(
                "active",
                mode === "movies"
            );


        document
            .getElementById(
                "btnSeries"
            )
            .classList
            .toggle(
                "active",
                mode === "series"
            );


        searchInput.value =
            "";


        await loadCategories();

        await loadItems();

    }


    // =====================================================
    // LOAD CATEGORIES
    // =====================================================

    async function loadCategories() {

        categorySelect.innerHTML =
            `
            <option value="">
                جميع التصنيفات
            </option>
            `;


        let endpoint;


        if (currentMode === "live") {

            endpoint =
                "/api/categories";

        }

        else if (
            currentMode === "movies"
        ) {

            endpoint =
                "/api/movie-categories";

        }

        else {

            endpoint =
                "/api/series-categories";

        }


        try {

            const response =
                await fetch(
                    API_BASE_URL +
                    endpoint
                );


            if (!response.ok) {
                throw new Error(
                    "HTTP " +
                    response.status
                );
            }


            const categories =
                await response.json();


            if (
                !Array.isArray(
                    categories
                )
            ) {

                return;

            }


            categories.forEach(
                category => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        category.category_id;


                    option.textContent =
                        category.category_name;


                    categorySelect
                        .appendChild(
                            option
                        );

                }
            );

        }

        catch (error) {

            console.error(
                "Categories error:",
                error
            );

        }

    }


    // =====================================================
    // LOAD ITEMS
    // =====================================================

    async function loadItems(
        categoryId = ""
    ) {

        grid.innerHTML =
            `
            <div class="message">
                جاري جلب المحتوى...
            </div>
            `;


        let endpoint;


        if (
            currentMode === "live"
        ) {

            endpoint =
                "/api/channels";

        }

        else if (
            currentMode === "movies"
        ) {

            endpoint =
                "/api/movies";

        }

        else {

            endpoint =
                "/api/series";

        }


        let url =
            API_BASE_URL +
            endpoint;


        if (categoryId) {

            url +=
                "?category_id=" +
                encodeURIComponent(
                    categoryId
                );

        }


        try {

            const response =
                await fetch(
                    url
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            if (
                !Array.isArray(
                    data
                )
            ) {

                throw new Error(
                    "Invalid API response"
                );

            }


            currentItems =
                data;


            renderItems(
                currentItems
            );


        }

        catch (error) {

            console.error(
                "Items error:",
                error
            );


            grid.innerHTML =
                `
                <div class="message error">
                    تعذر جلب البيانات من السيرفر.
                    <br>
                    تحقق من Render و Xtream API.
                </div>
                `;

        }

    }


    // =====================================================
    // RENDER ITEMS
    // =====================================================

    function renderItems(
        items
    ) {

        grid.innerHTML =
            "";


        if (
            !items ||
            items.length === 0
        ) {

            grid.innerHTML =
                `
                <div class="message">
                    لا يوجد محتوى في هذا التصنيف.
                </div>
                `;

            return;

        }


        items.forEach(
            item => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "card";


                const title =
                    item.title ||
                    "بدون اسم";


                const poster =
                    item.poster ||
                    defaultImage;


                card.innerHTML =
                    `
                    <img
                        src="${escapeHtml(poster)}"
                        onerror="this.src='${defaultImage}'"
                        loading="lazy"
                    >

                    <h4>
                        ${escapeHtml(title)}
                    </h4>
                    `;


                card.onclick =
                    function() {

                        if (
                            currentMode ===
                            "series"
                        ) {

                            openSeries(
                                item
                            );

                        }

                        else {

                            playStream(
                                item.stream_url
                            );

                        }

                    };


                grid.appendChild(
                    card
                );

            }
        );

    }


    // =====================================================
    // OPEN SERIES
    // =====================================================

    async function openSeries(
        series
    ) {

        grid.innerHTML =
            `
            <div class="message">
                جاري تحميل الحلقات...
            </div>
            `;


        try {

            const response =
                await fetch(
                    API_BASE_URL +
                    "/api/series/" +
                    encodeURIComponent(
                        series.id
                    )
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            renderSeries(
                data,
                series
            );


        }

        catch (error) {

            console.error(
                "Series error:",
                error
            );


            grid.innerHTML =
                `
                <div class="message error">
                    تعذر تحميل حلقات المسلسل.
                </div>
                `;

        }

    }


    // =====================================================
    // RENDER SERIES
    // =====================================================

    function renderSeries(
        data,
        series
    ) {

        grid.innerHTML =
            "";


        const back =
            document.createElement(
                "button"
            );


        back.className =
            "back-btn";


        back.textContent =
            "⬅ العودة للمسلسلات";


        back.onclick =
            function() {

                loadItems(
                    categorySelect.value
                );

            };


        grid.appendChild(
            back
        );


        if (
            data.info &&
            (
                data.info.plot ||
                data.info.name
            )
        ) {

            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "series-info";


            info.innerHTML =
                `
                <h2>
                    ${escapeHtml(
                        data.info.name ||
                        series.title
                    )}
                </h2>

                <p>
                    ${escapeHtml(
                        data.info.plot ||
                        "لا يوجد وصف."
                    )}
                </p>
                `;


            grid.appendChild(
                info
            );

        }


        const seasons =
            data.seasons || [];


        if (
            seasons.length === 0
        ) {

            const msg =
                document.createElement(
                    "div"
                );


            msg.className =
                "message";


            msg.textContent =
                "لم يتم العثور على مواسم أو حلقات.";


            grid.appendChild(
                msg
            );


            return;

        }


        seasons.forEach(
            season => {

                const seasonTitle =
                    document.createElement(
                        "div"
                    );


                seasonTitle.className =
                    "season-title";


                seasonTitle.style
                    .gridColumn =
                    "1 / -1";


                seasonTitle.textContent =
                    "📀 الموسم " +
                    season.season;


                grid.appendChild(
                    seasonTitle
                );


                const episodes =
                    season.episodes || [];


                episodes.forEach(
                    episode => {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "card";


                        const image =
                            episode.poster ||
                            series.poster ||
                            defaultImage;


                        card.innerHTML =
                            `
                            <img
                                src="${escapeHtml(image)}"
                                onerror="this.src='${defaultImage}'"
                                loading="lazy"
                            >

                            <h4>
                                ${escapeHtml(
                                    episode.title
                                )}
                            </h4>

                            <small>
                                الحلقة
                                ${escapeHtml(
                                    String(
                                        episode.episode_num
                                    )
                                )}
                            </small>
                            `;


                        card.onclick =
                            function() {

                                playStream(
                                    episode.stream_url
                                );

                            };


                        grid.appendChild(
                            card
                        );

                    }
                );

            }
        );

    }


    // =====================================================
    // CATEGORY CHANGE
    // =====================================================

    function onCategoryChange() {

        loadItems(
            categorySelect.value
        );

    }


    // =====================================================
    // SEARCH
    // =====================================================

    function filterItems() {

        const query =
            searchInput.value
                .trim()
                .toLowerCase();


        if (!query) {

            renderItems(
                currentItems
            );

            return;

        }


        const filtered =
            currentItems.filter(
                item =>
                    String(
                        item.title || ""
                    )
                    .toLowerCase()
                    .includes(query)
            );


        renderItems(
            filtered
        );

    }


    // =====================================================
    // HTML ESCAPE
    // =====================================================

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    // =====================================================
    // START
    // =====================================================

    switchMode(
        "live"
    );

</script>

</body>

</html>
