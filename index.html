<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIBSSA TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 15px; text-align: center; }
        h1 { color: #38bdf8; margin-bottom: 15px; font-size: 24px; }
        
        .player-container { width: 100%; max-width: 800px; margin: 0 auto 20px; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        video { width: 100%; height: 260px; background: #000; display: block; }
        
        .controls-container { max-width: 800px; margin: 0 auto 15px; }
        .category-select { width: 100%; padding: 12px; border-radius: 8px; background: #1e293b; color: #fff; border: 1px solid #334155; font-size: 14px; outline: none; cursor: pointer; }
        
        .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-width: 800px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 10px; padding: 8px; cursor: pointer; transition: transform 0.2s, background 0.2s; text-align: center; }
        .card:hover { transform: translateY(-3px); background: #334155; }
        .card img { width: 100%; height: 100px; object-fit: contain; border-radius: 6px; background-color: #0f172a; padding: 5px; }
        .card h4 { font-size: 12px; margin-top: 8px; color: #e2e8f0; word-break: break-word; line-height: 1.3; }
        
        .message { grid-column: 1/-1; color: #94a3b8; padding: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <h1>📺 BIBSSA TV</h1>

    <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="controls-container">
        <select id="categorySelect" class="category-select" onchange="onCategoryChange()">
            <option value="">جميع تصنيفات القنوات</option>
        </select>
    </div>

    <div class="content-grid" id="grid">
        <div class="message">جاري التحميل...</div>
    </div>

    <script>
        const API_BASE_URL = "https://bibssa-tv.onrender.com";
        const video = document.getElementById('videoPlayer');
        let hls = null;

        function playStream(url) {
            if (Hls.isSupported() && url.includes('.m3u8')) {
                if (hls) { hls.destroy(); }
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = url;
                video.play();
            }
        }

        async function loadCategories() {
            const select = document.getElementById('categorySelect');
            select.innerHTML = '<option value="">جميع تصنيفات القنوات</option>';
            try {
                const res = await fetch(`${API_BASE_URL}/api/categories`);
                const categories = await res.json();
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.category_id;
                    opt.textContent = cat.category_name;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("خطأ في جلب التصنيفات:", err);
            }
        }

        async function loadChannels(categoryId = '') {
            const grid = document.getElementById('grid');
            grid.innerHTML = '<div class="message">جاري تحميل القنوات...</div>';

            try {
                let url = `${API_BASE_URL}/api/channels`;
                if (categoryId) {
                    url += `?category_id=${categoryId}`;
                }
                const res = await fetch(url);
                const data = await res.json();
                
                grid.innerHTML = '';
                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="message">لا توجد قنوات متوفرة في هذا التصنيف</div>';
                    return;
                }

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => playStream(item.stream_url);
                    
                    const defaultImg = 'https://via.placeholder.com/150x100?text=TV';
                    const imgUrl = item.poster ? item.poster : defaultImg;

                    card.innerHTML = `
                        <img src="${imgUrl}" onerror="this.src='${defaultImg}'">
                        <h4>${item.title}</h4>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                grid.innerHTML = '<div class="message" style="color:#f87171;">تعذر الاتصال بالسيرفر!</div>';
            }
        }

        function onCategoryChange() {
            const catId = document.getElementById('categorySelect').value;
            loadChannels(catId);
        }

        // التحميل الأولي عند فتح الصفحة
        loadCategories();
        loadChannels();
    </script>
</body>
</html>
