<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIBSSA TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 15px; text-align: center; }
        h1 { color: #38bdf8; margin-bottom: 15px; }
        .player-container { width: 100%; max-width: 800px; margin: 0 auto 20px; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; height: 250px; background: #000; }
        .tabs { display: flex; gap: 10px; max-width: 800px; margin: 0 auto 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #1e293b; color: #fff; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: #0284c7; }
        .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 10px; padding: 10px; cursor: pointer; }
        .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; }
        .card h4 { font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>BIBSSA TV</h1>

    <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="loadContent('matches', this)">المباشر</button>
        <button class="tab-btn" onclick="loadContent('movies', this)">الأفلام</button>
        <button class="tab-btn" onclick="loadContent('series', this)">المسلسلات</button>
    </div>

    <div class="content-grid" id="grid">
        <div style="grid-column: 1/-1; color: #94a3b8;">جاري تحميل البيانات...</div>
    </div>

    <script>
        const API_BASE_URL = "https://bibssa-tv.onrender.com";
        const video = document.getElementById('videoPlayer');
        let hls = null;

        function playStream(url) {
            if (Hls.isSupported() && url.endsWith('.m3u8')) {
                if (hls) { hls.destroy(); }
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = url;
                video.play();
            }
        }

        async function loadContent(type, btn) {
            if (btn) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            const grid = document.getElementById('grid');
            grid.innerHTML = '<div style="grid-column: 1/-1; color: #94a3b8;">جاري الاتصال بالسيرفر...</div>';

            try {
                const res = await fetch(`${API_BASE_URL}/api/${type}`);
                const data = await res.json();
                grid.innerHTML = '';
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => playStream(item.stream_url);
                    let imgHtml = item.poster ? `<img src="${item.poster}">` : '';
                    card.innerHTML = `${imgHtml}<h4>${item.title}</h4>`;
                    grid.appendChild(card);
                });
            } catch (err) {
                grid.innerHTML = '<div style="grid-column: 1/-1; color: #f87171;">حدث خطأ في الاتصال بالسيرفر!</div>';
            }
        }

        loadContent('matches');
    </script>
</body>
</html>
