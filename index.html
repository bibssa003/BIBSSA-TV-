<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BIBSSA TV</title>

    <!-- =====================================================
         HLS.JS
         ===================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- =====================================================
         MPEG-TS.JS
         مهم جداً لبث video/mp2t
         ===================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family:
                Arial,
                Tahoma,
                sans-serif;
            background: #0b0f14;
            color: #fff;
        }

        body {
            overflow-x: hidden;
        }

        /* =====================================================
           HEADER
           ===================================================== */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            height: 70px;

            display: flex;
            align-items: center;
            gap: 20px;

            padding: 0 25px;

            background: rgba(10, 14, 20, 0.96);

            border-bottom: 1px solid #202833;

            backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #00d9ff;
            white-space: nowrap;
        }

        .logo span {
            color: #fff;
        }

        .nav {
            display: flex;
            gap: 8px;
        }

        .nav button {
            border: 0;
            background: transparent;
            color: #aaa;

            padding: 10px 15px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;
        }

        .nav button:hover,
        .nav button.active {
            background: #17202b;
            color: #00d9ff;
        }

        .search-box {
            margin-right: auto;

            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 240px;

            padding: 11px 14px;

            border-radius: 8px;

            border: 1px solid #28323e;

            outline: none;

            background: #111821;
            color: #fff;
        }

        .search-box input:focus {
            border-color: #00bcd4;
        }

        /* =====================================================
           PLAYER & CUSTOM CONTROLS
           ===================================================== */

        .player-section {
            display: none;

            padding: 20px;
        }

        .player-section.show {
            display: block;
        }

        .player-container {
            max-width: 1200px;
            margin: auto;

            background: #050709;

            border: 1px solid #222b35;

            border-radius: 12px;

            overflow: hidden;
            position: relative;
        }

        /* Custom Player Wrapper */
        .custom-player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            user-select: none;
        }

        #videoPlayer {
            display: block;

            width: 100%;

            height: min(68vh, 680px);

            background: #000;

            object-fit: contain;
        }

        /* Custom Overlay Controls */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            padding: 10px 15px;
            gap: 8px;
            transition: opacity 0.3s ease;
            opacity: 1;
            z-index: 10;
        }

        .custom-controls.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
        }

        .progress-bar {
            height: 100%;
            background: #00d9ff;
            border-radius: 3px;
            width: 0%;
            position: relative;
        }

        .progress-container:hover {
            height: 8px;
        }

        /* Controls Row */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-ctrl {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .btn-ctrl:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #00d9ff;
        }

        .time-display {
            font-size: 13px;
            color: #ddd;
            font-family: monospace;
            white-space: nowrap;
        }

        /* Volume Controls */
        .volume-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .volume-slider {
            width: 70px;
            accent-color: #00d9ff;
            cursor: pointer;
        }

        /* Select Quality */
        .quality-select {
            background: #111821;
            color: #fff;
            border: 1px solid #28323e;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        .quality-select:focus {
            border-color: #00d9ff;
        }

        .player-info {
            padding: 15px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            background: #10161e;
        }

        .player-title {
            font-size: 18px;
            font-weight: bold;
        }

        .close-player {
            border: 0;

            padding: 9px 15px;

            border-radius: 7px;

            background: #d62828;
            color: #fff;

            cursor: pointer;
        }

        .close-player:hover {
            background: #ef3b3b;
        }

        /* =====================================================
           MAIN
           ===================================================== */

        main {
            padding: 20px;
        }

        .toolbar {
            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        .toolbar select {
            min-width: 220px;

            padding: 11px 14px;

            border-radius: 8px;

            border: 1px solid #28323e;

            background: #111821;

            color: #fff;

            outline: none;
        }

        .page-title {
            font-size: 22px;
            font-weight: bold;
        }

        /* =====================================================
           GRID
           ===================================================== */

        .grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(180px, 1fr)
                );

            gap: 16px;
        }

        .card {
            position: relative;

            background: #111821;

            border: 1px solid #202a35;

            border-radius: 10px;

            overflow: hidden;

            cursor: pointer;

            transition:
                transform .18s ease,
                border-color .18s ease,
                box-shadow .18s ease;
        }

        .card:hover {
            transform: translateY(-4px);

            border-color: #00bcd4;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, .35);
        }

        .card-image {
            width: 100%;

            height: 150px;

            background: #080b0f;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .card-image img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        .no-logo {
            font-size: 40px;
            opacity: .3;
        }

        .card-content {
            padding: 12px;
        }

        .card-title {
            font-size: 15px;

            font-weight: bold;

            line-height: 1.4;

            display: -webkit-box;

            -webkit-line-clamp: 2;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .card-group {
            margin-top: 7px;

            font-size: 12px;

            color: #7e8a96;
        }

        /* =====================================================
           STATUS
           ===================================================== */

        .status {
            padding: 25px;

            text-align: center;

            color: #9aa5b1;
        }

        .error {
            color: #ff6262;
        }

        .loading {
            color: #00d9ff;
        }

        /* =====================================================
           AD OVERLAY SYSTEM (الإعلان عند فتح التطبيق)
           ===================================================== */

        .ad-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .ad-modal-content {
            position: relative;
            background: #111821;
            border: 1px solid #00d9ff;
            border-radius: 12px;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
        }

        .ad-close-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #d62828;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .ad-close-btn:hover {
            background: #ef3b3b;
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 800px) {

            header {
                height: auto;

                min-height: 65px;

                padding: 12px;

                flex-wrap: wrap;
            }

            .search-box {
                width: 100%;

                order: 3;
            }

            .search-box input {
                width: 100%;
            }

            .nav {
                overflow-x: auto;
            }

            main {
                padding: 12px;
            }

            .grid {
                grid-template-columns:
                    repeat(
                        auto-fill,
                        minmax(140px, 1fr)
                    );

                gap: 10px;
            }

            .card-image {
                height: 120px;
            }

            #videoPlayer {
                height: 45vh;
            }

            .volume-slider {
                width: 45px;
            }

            .controls-row {
                gap: 6px;
            }
        }

    </style>
</head>


<body>

<!-- =========================================================
     HEADER
     ========================================================= -->

<header>

    <div class="logo">
        BIBSSA <span>TV</span>
    </div>

    <nav class="nav">

        <button
            id="liveBtn"
            class="active"
            onclick="changeSection('live')"
        >
            📺 القنوات
        </button>

        <button
            id="moviesBtn"
            onclick="changeSection('movie')"
        >
            🎬 الأفلام
        </button>

        <button
            id="seriesBtn"
            onclick="changeSection('series')"
        >
            📚 المسلسلات
        </button>

    </nav>

    <div class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="بحث..."
            autocomplete="off"
        >

    </div>

</header>


<!-- =========================================================
     PLAYER
     ========================================================= -->

<section
    id="playerSection"
    class="player-section"
>

    <div class="player-container">

        <!-- Custom Player Container -->
        <div class="custom-player-wrapper" id="customPlayerWrapper">
            <video
                id="videoPlayer"
                playsinline
                muted
            ></video>

            <!-- Custom Controls UI -->
            <div class="custom-controls" id="customControls">
                
                <!-- Timeline Progress Bar -->
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <!-- Control Buttons and Controls Bar -->
                <div class="controls-row">
                    
                    <!-- Left Group: Play/Pause, Seek, Volume, Time -->
                    <div class="controls-group">
                        <button class="btn-ctrl" id="playPauseBtn" title="تشغيل / إيقاف">▶</button>
                        
                        <button class="btn-ctrl" id="rewindBtn" title="تأخير 10 ثوانٍ">⏪ 10s</button>
                        <button class="btn-ctrl" id="forwardBtn" title="تقديم 10 ثوانٍ">10s ⏩</button>

                        <div class="volume-group">
                            <button class="btn-ctrl" id="muteBtn" title="كتم / تشغيل الصوت">🔊</button>
                            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="1">
                        </div>

                        <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
                    </div>

                    <!-- Right Group: Quality & Fullscreen -->
                    <div class="controls-group">
                        <select id="qualitySelect" class="quality-select" title="جودة البث">
                            <option value="-1">الجودة: تلقائي</option>
                        </select>

                        <button class="btn-ctrl" id="fullscreenBtn" title="ملء الشاشة">⛶</button>
                    </div>

                </div>

            </div>
        </div>

        <div class="player-info">

            <div
                id="playerTitle"
                class="player-title"
            >
                جاري التشغيل...
            </div>

            <button
                class="close-player"
                onclick="closePlayer()"
            >
                إغلاق
            </button>

        </div>

    </div>

</section>


<!-- =========================================================
     MAIN
     ========================================================= -->

<main>

    <div class="toolbar">

        <div
            id="pageTitle"
            class="page-title"
        >
            القنوات
        </div>

        <select
            id="categorySelect"
        >
            <option value="">
                كل التصنيفات
            </option>
        </select>

    </div>


    <div
        id="status"
        class="status loading"
    >
        جاري تحميل البيانات...
    </div>


    <div
        id="grid"
        class="grid"
    ></div>

</main>


<!-- =========================================================
     AD MODAL CONTAINER (نافذة الإعلان)
     ========================================================= -->

<div id="adModal" class="ad-modal-overlay" style="display: none;">
    <div class="ad-modal-content">
        <button class="ad-close-btn" onclick="closeAdModal()">إغلاق ✕</button>
        <div style="margin-top: 25px;" id="adSpace">
            <!-- ضع كود الإعلان الخاص بك هنا (مثل Monetag أو PropellerAds أو Google AdSense) -->
            <p style="color: #aaa; font-size: 14px;">إعلان مالي عالي العائد</p>
        </div>
    </div>
</div>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const API_BASE_URL =
    "https://bibssa-tv.onrender.com";


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let currentSection = "live";

let allItems = [];

let filteredItems = [];

let hlsPlayer = null;

let mpegtsPlayer = null;

let controlsTimeout = null;


/* =========================================================
   DOM
   ========================================================= */

const grid =
    document.getElementById("grid");

const status =
    document.getElementById("status");

const categorySelect =
    document.getElementById("categorySelect");

const searchInput =
    document.getElementById("searchInput");

const playerSection =
    document.getElementById("playerSection");

const videoPlayer =
    document.getElementById("videoPlayer");

const playerTitle =
    document.getElementById("playerTitle");

const pageTitle =
    document.getElementById("pageTitle");

/* Custom Controls Elements */
const customPlayerWrapper = document.getElementById("customPlayerWrapper");
const customControls = document.getElementById("customControls");
const playPauseBtn = document.getElementById("playPauseBtn");
const rewindBtn = document.getElementById("rewindBtn");
const forwardBtn = document.getElementById("forwardBtn");
const muteBtn = document.getElementById("muteBtn");
const volumeSlider = document.getElementById("volumeSlider");
const timeDisplay = document.getElementById("timeDisplay");
const progressContainer = document.getElementById("progressContainer");
const progressBar = document.getElementById("progressBar");
const qualitySelect = document.getElementById("qualitySelect");
const fullscreenBtn = document.getElementById("fullscreenBtn");


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   AD SYSTEM FUNCTION (عرض الإعلان مرة واحدة عند الدخول)
   ========================================================= */

function showAppOpenAd() {

    const adShown = sessionStorage.getItem("app_ad_shown");

    if (!adShown) {

        document.getElementById("adModal").style.display = "flex";

        sessionStorage.setItem("app_ad_shown", "true");
    }
}

function closeAdModal() {

    document.getElementById("adModal").style.display = "none";
}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadSection() {

    try {

        setStatus(
            "جاري تحميل البيانات...",
            "loading"
        );

        grid.innerHTML = "";

        let endpoint = "";

        if (currentSection === "live") {

            endpoint =
                "/api/channels";

        } else if (currentSection === "movie") {

            endpoint =
                "/api/movies";

        } else {

            endpoint =
                "/api/series";
        }


        const response =
            await fetch(
                API_BASE_URL + endpoint,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }


        allItems =
            await response.json();


        filteredItems =
            [...allItems];


        await loadCategories();

        renderItems();


    } catch (error) {

        console.error(error);

        setStatus(
            "فشل تحميل البيانات: " +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   LOAD CATEGORIES
   ========================================================= */

async function loadCategories() {

    categorySelect.innerHTML =
        '<option value="">كل التصنيفات</option>';

    try {

        let endpoint = "";

        if (currentSection === "live") {

            endpoint =
                "/api/categories";

        } else if (currentSection === "movie") {

            endpoint =
                "/api/movie-categories";

        } else {

            endpoint =
                "/api/series-categories";
        }


        const response =
            await fetch(
                API_BASE_URL + endpoint,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        const categories =
            await response.json();


        categories.forEach(category => {

            const option =
                document.createElement("option");

            option.value =
                category.category_id;

            option.textContent =
                category.category_name;

            categorySelect.appendChild(
                option
            );
        });


    } catch (error) {

        console.error(
            "Category error:",
            error
        );
    }
}


/* =========================================================
   FILTER CATEGORY
   ========================================================= */

categorySelect.addEventListener(
    "change",
    async function() {

        const categoryId =
            this.value;


        if (!categoryId) {

            filteredItems =
                [...allItems];

            renderItems();

            return;
        }


        try {

            let endpoint = "";

            if (currentSection === "live") {

                endpoint =
                    "/api/channels?category_id=";

            } else if (currentSection === "movie") {

                endpoint =
                    "/api/movies?category_id=";

            } else {

                endpoint =
                    "/api/series?category_id=";
            }


            const response =
                await fetch(
                    API_BASE_URL +
                    endpoint +
                    encodeURIComponent(categoryId)
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " + response.status
                );
            }


            filteredItems =
                await response.json();


            renderItems();


        } catch (error) {

            console.error(error);

            setStatus(
                "تعذر تحميل التصنيف",
                "error"
            );
        }
    }
);


/* =========================================================
   SEARCH
   ========================================================= */

searchInput.addEventListener(
    "input",
    function() {

        const search =
            this.value
                .trim()
                .toLowerCase();


        if (!search) {

            renderItems();

            return;
        }


        const source =
            filteredItems.length
                ? filteredItems
                : allItems;


        const results =
            source.filter(item => {

                const title =
                    String(
                        item.title || ""
                    ).toLowerCase();

                const group =
                    String(
                        item.group || ""
                    ).toLowerCase();

                return (
                    title.includes(search) ||
                    group.includes(search)
                );
            });


        renderItems(results);
    }
);


/* =========================================================
   RENDER ITEMS
   ========================================================= */

function renderItems(items = filteredItems) {

    grid.innerHTML = "";


    if (!items.length) {

        setStatus(
            "لا توجد نتائج.",
            ""
        );

        return;
    }


    status.style.display =
        "none";


    items.forEach(item => {

        const card =
            document.createElement("div");

        card.className =
            "card";


        const title =
            escapeHTML(
                item.title || "بدون اسم"
            );


        const group =
            escapeHTML(
                item.group || ""
            );


        const poster =
            item.poster ||
            item.logo ||
            "";


        let imageHTML =
            '<div class="no-logo">📺</div>';


        if (poster) {

            imageHTML =
                `
                <img
                    src="${escapeHTML(poster)}"
                    alt="${title}"
                    loading="lazy"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
                >
                <div
                    class="no-logo"
                    style="display:none;"
                >
                    📺
                </div>
                `;
        }


        card.innerHTML = `

            <div class="card-image">
                ${imageHTML}
            </div>

            <div class="card-content">

                <div class="card-title">
                    ${title}
                </div>

                <div class="card-group">
                    ${group}
                </div>

            </div>

        `;


        card.addEventListener(
            "click",
            () => {

                if (item.stream_url) {

                    playStream(
                        item.stream_url,
                        item.title
                    );

                } else {

                    alert(
                        "لا يوجد رابط بث لهذا العنصر."
                    );
                }
            }
        );


        grid.appendChild(card);

    });
}


/* =========================================================
   CHANGE SECTION
   ========================================================= */

async function changeSection(section) {

    currentSection =
        section;


    document
        .querySelectorAll(".nav button")
        .forEach(button => {

            button.classList.remove(
                "active"
            );
        });


    if (section === "live") {

        document
            .getElementById("liveBtn")
            .classList.add("active");

        pageTitle.textContent =
            "القنوات";

    } else if (section === "movie") {

        document
            .getElementById("moviesBtn")
            .classList.add("active");

        pageTitle.textContent =
            "الأفلام";

    } else {

        document
            .getElementById("seriesBtn")
            .classList.add("active");

        pageTitle.textContent =
            "المسلسلات";
    }


    searchInput.value = "";

    await loadSection();
}


/* =========================================================
   STOP CURRENT PLAYER
   ========================================================= */

function destroyPlayers() {

    /* HLS */

    if (hlsPlayer) {

        try {
            hlsPlayer.destroy();
        } catch (error) {
            console.warn(error);
        }

        hlsPlayer = null;
    }


    /* MPEG-TS */

    if (mpegtsPlayer) {

        try {
            mpegtsPlayer.pause();
        } catch (error) {}

        try {
            mpegtsPlayer.unload();
        } catch (error) {}

        try {
            mpegtsPlayer.detachMediaElement();
        } catch (error) {}

        try {
            mpegtsPlayer.destroy();
        } catch (error) {}

        mpegtsPlayer = null;
    }


    try {

        videoPlayer.pause();

        videoPlayer.removeAttribute(
            "src"
        );

        videoPlayer.load();

    } catch (error) {

        console.warn(error);
    }

    resetQualityOptions();
}


/* =========================================================
   CUSTOM PLAYER CONTROLS LOGIC
   ========================================================= */

/* Format Time (seconds -> mm:ss or hh:mm:ss) */
function formatTime(seconds) {
    if (isNaN(seconds) || seconds === Infinity) return "LIVE";
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);

    const formattedMins = mins < 10 ? "0" + mins : mins;
    const formattedSecs = secs < 10 ? "0" + secs : secs;

    if (hrs > 0) {
        return `${hrs}:${formattedMins}:${formattedSecs}`;
    }
    return `${formattedMins}:${formattedSecs}`;
}

/* Toggle Play / Pause */
function togglePlay() {
    if (videoPlayer.paused || videoPlayer.ended) {
        videoPlayer.play().catch(console.warn);
    } else {
        videoPlayer.pause();
    }
}

/* Update Play/Pause Button Icon */
videoPlayer.addEventListener("play", () => {
    playPauseBtn.textContent = "⏸";
    showControlsTemporarily();
});

videoPlayer.addEventListener("pause", () => {
    playPauseBtn.textContent = "▶";
    showControlsTemporarily();
});

/* Time and Progress Updates */
videoPlayer.addEventListener("timeupdate", () => {
    const curTime = videoPlayer.currentTime;
    const dur = videoPlayer.duration;

    if (!isNaN(dur) && dur > 0 && dur !== Infinity) {
        const percent = (curTime / dur) * 100;
        progressBar.style.width = percent + "%";
        timeDisplay.textContent = `${formatTime(curTime)} / ${formatTime(dur)}`;
    } else {
        progressBar.style.width = "100%";
        timeDisplay.textContent = `${formatTime(curTime)} / 🔴 بث مباشر`;
    }
});

/* Seek on Progress Bar Click */
progressContainer.addEventListener("click", (e) => {
    const rect = progressContainer.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    if (!isNaN(videoPlayer.duration) && videoPlayer.duration > 0 && videoPlayer.duration !== Infinity) {
        videoPlayer.currentTime = pos * videoPlayer.duration;
    }
});

/* Forward / Rewind 10 Seconds */
rewindBtn.addEventListener("click", () => {
    videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 10);
});

forwardBtn.addEventListener("click", () => {
    if (!isNaN(videoPlayer.duration)) {
        videoPlayer.currentTime = Math.min(videoPlayer.duration, videoPlayer.currentTime + 10);
    }
});

/* Volume & Mute Controls */
muteBtn.addEventListener("click", () => {
    videoPlayer.muted = !videoPlayer.muted;
    updateVolumeUI();
});

volumeSlider.addEventListener("input", (e) => {
    videoPlayer.volume = e.target.value;
    videoPlayer.muted = (e.target.value == 0);
    updateVolumeUI();
});

function updateVolumeUI() {
    if (videoPlayer.muted || videoPlayer.volume == 0) {
        muteBtn.textContent = "🔇";
        volumeSlider.value = 0;
    } else {
        muteBtn.textContent = "🔊";
        volumeSlider.value = videoPlayer.volume;
    }
}

/* Quality Management */
function resetQualityOptions() {
    qualitySelect.innerHTML = '<option value="-1">الجودة: تلقائي</option>';
}

function updateHlsQualityLevels(levels) {
    resetQualityOptions();
    if (!levels || levels.length <= 1) return;

    levels.forEach((level, index) => {
        const option = document.createElement("option");
        option.value = index;
        const height = level.height || "SD";
        const bitrate = level.bitrate ? Math.round(level.bitrate / 1000) + "k" : "";
        option.textContent = `${height}p ${bitrate ? '(' + bitrate + ')' : ''}`;
        qualitySelect.appendChild(option);
    });
}

qualitySelect.addEventListener("change", (e) => {
    const levelIndex = parseInt(e.target.value);
    if (hlsPlayer) {
        hlsPlayer.currentLevel = levelIndex;
    }
});

/* Fullscreen Control */
fullscreenBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
        if (customPlayerWrapper.requestFullscreen) {
            customPlayerWrapper.requestFullscreen();
        } else if (customPlayerWrapper.webkitRequestFullscreen) {
            customPlayerWrapper.webkitRequestFullscreen();
        }
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
});

/* Toggle Play on Video Area Click */
videoPlayer.addEventListener("click", togglePlay);
playPauseBtn.addEventListener("click", togglePlay);

/* Auto Hide Controls on Inactivity */
function showControlsTemporarily() {
    customControls.classList.remove("hidden");
    clearTimeout(controlsTimeout);
    if (!videoPlayer.paused) {
        controlsTimeout = setTimeout(() => {
            customControls.classList.add("hidden");
        }, 3000);
    }
}

customPlayerWrapper.addEventListener("mousemove", showControlsTemporarily);
customPlayerWrapper.addEventListener("touchstart", showControlsTemporarily, { passive: true });


/* =========================================================
   PLAY STREAM
   ========================================================= */

async function playStream(
    streamUrl,
    title = "القناة"
) {

    if (!streamUrl) {

        alert(
            "رابط البث غير موجود."
        );

        return;
    }


    playerTitle.textContent =
        title || "القناة";


    playerSection.classList.add(
        "show"
    );


    destroyPlayers();


    /* -----------------------------------------------------
       PROXY URL
       ----------------------------------------------------- */

    const proxyUrl =
        API_BASE_URL +
        "/proxy?url=" +
        encodeURIComponent(
            streamUrl
        );


    console.log(
        "Original stream:",
        streamUrl
    );

    console.log(
        "Proxy stream:",
        proxyUrl
    );


    /* -----------------------------------------------------
       تحديد نوع البث من الرابط
       ----------------------------------------------------- */

    const lowerUrl =
        streamUrl.toLowerCase();


    /*
       إذا كان الرابط واضحاً أنه HLS
    */

    const looksLikeHLS =
        lowerUrl.includes(".m3u8") ||
        lowerUrl.includes("m3u8");


    /*
       إذا كان MPEG-TS
       في حالتنا السيرفر يرجع video/mp2t
    */

    const looksLikeTS =
        lowerUrl.endsWith(".ts") ||
        lowerUrl.includes(".ts?");


    /* =====================================================
       HLS
       ===================================================== */

    if (looksLikeHLS) {

        if (
            window.Hls &&
            Hls.isSupported()
        ) {

            hlsPlayer =
                new Hls({
                    enableWorker: true,

                    lowLatencyMode: true,

                    backBufferLength: 30,

                    maxBufferLength: 30,

                    maxMaxBufferLength: 60,

                    liveSyncDurationCount: 3
                });


            hlsPlayer.loadSource(
                proxyUrl
            );


            hlsPlayer.attachMedia(
                videoPlayer
            );


            hlsPlayer.on(
                Hls.Events.MANIFEST_PARSED,
                function(event, data) {

                    updateHlsQualityLevels(data.levels);

                    videoPlayer.muted =
                        false;

                    updateVolumeUI();

                    videoPlayer.play()
                        .catch(error => {

                            console.warn(
                                "Autoplay:",
                                error
                            );
                        });
                }
            );


            hlsPlayer.on(
                Hls.Events.ERROR,
                function(
                    event,
                    data
                ) {

                    console.error(
                        "HLS error:",
                        data
                    );
                }
            );


            return;
        }


        /*
           Safari / native HLS
        */

        if (
            videoPlayer.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            videoPlayer.src =
                proxyUrl;

            videoPlayer.play()
                .catch(console.warn);

            return;
        }
    }


    /* =====================================================
       MPEG-TS
       ===================================================== */

    if (
        window.mpegts &&
        mpegts.isSupported()
    ) {

        console.log(
            "Using MPEG-TS player"
        );


        mpegtsPlayer =
            mpegts.createPlayer(
                {
                    type: "mpegts",

                    isLive: true,

                    url: proxyUrl
                },
                {
                    enableWorker: true,

                    lazyLoad: false,

                    autoCleanupSourceBuffer: true,

                    liveBufferLatencyChasing: true,

                    liveBufferLatencyMaxLatency: 5,

                    liveBufferLatencyMinRemain: 1
                }
            );


        mpegtsPlayer.attachMediaElement(
            videoPlayer
        );


        mpegtsPlayer.load();


        mpegtsPlayer.play()
            .catch(error => {

                console.warn(
                    "MPEG-TS autoplay:",
                    error
                );
            });


        mpegtsPlayer.on(
            mpegts.Events.ERROR,
            function(
                errorType,
                errorDetail,
                errorInfo
            ) {

                console.error(
                    "MPEG-TS error:",
                    errorType,
                    errorDetail,
                    errorInfo
                );
            }
        );


        return;
    }


    /* =====================================================
       NATIVE FALLBACK
       ===================================================== */

    console.log(
        "Using native video"
    );


    videoPlayer.src =
        proxyUrl;


    videoPlayer.play()
        .catch(error => {

            console.warn(
                "Native playback:",
                error
            );
        });
}


/* =========================================================
   CLOSE PLAYER
   ========================================================= */

function closePlayer() {

    destroyPlayers();

    playerSection.classList.remove(
        "show"
    );
}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
    message,
    className = ""
) {

    status.style.display =
        "block";

    status.className =
        "status " + className;

    status.textContent =
        message;
}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadSection();

        /* تشغيل الإعلان عند فتح التطبيق */
        showAppOpenAd();

    }
);


/* =========================================================
   KEYBOARD ESC & SHORTCUTS
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closePlayer();
        }

        /* Space to Play/Pause when Player active */
        if (event.code === "Space" && playerSection.classList.contains("show")) {
            event.preventDefault();
            togglePlay();
        }
    }
);

</script>
