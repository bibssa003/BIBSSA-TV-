<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIBSSA TV</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00d2ff">
    <!-- مكتبة مشغل Video.js القوي -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <style>
        :root { --primary: #00d2ff; --bg: #0d0e12; --card: #181a20; --border: #2a2d37; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: #fff; padding-bottom: 70px; }
        header { background: #121318; padding: 12px; text-align: center; border-bottom: 1px solid var(--border); }
        header h1 { color: var(--primary); font-size: 20px; }
        
        .player-wrapper { width: 100%; max-width: 850px; margin: 10px auto; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; position: relative; }
        .video-js { width: 100% !important; height: 100% !important; }
        iframe { width: 100%; height: 100%; border: none; }

        .tabs { display: flex; justify-content: center; gap: 10px; margin: 15px; }
        .tab-btn { background: var(--card); color: #888; border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: #000; }

        .container { max-width: 900px; margin: 0 auto; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px; text-align: center; cursor: pointer; }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
        .card h4 { font-size: 11px; margin-top: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        .match-card { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .team { font-weight: bold; font-size: 13px; }
        .status { background: rgba(0,210,255,0.2); color: var(--primary); padding: 3px 8px; border-radius: 4px; font-size: 11px; }

        .btn-direct { display: block; width: 100%; text-align: center; background: #222; color: #fff; text-decoration: none; padding: 6px; font-size: 11px; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body>

    <header><h1>BIBSSA TV 📺</h1></header>

    <div class="player-wrapper" id="player-box">
        <video id="my-video" class="video-js vjs-default-skin" controls preload="auto" data-setup='{}'></video>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" id="btn-sports" onclick="showTab('sports')">⚽ المباريات الحية</button>
            <button class="tab-btn" id="btn-cinema" onclick="showTab('cinema')">🎬 الأفلام والسينما</button>
        </div>

        <div id="sports-sec">
            <div id="matches-list">جاري جلب المباريات والقنوات...</div>
        </div>

        <div id="cinema-sec" style="display:none;">
            <div class="grid" id="movies-grid">جاري جلب الأفلام...</div>
        </div>
    </div>

    <script>
        let player = videojs('my-video');

        function playStream(url, isIframe = false) {
            const box = document.getElementById('player-box');
            if (isIframe) {
                box.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay"></iframe>`;
            } else {
                box.innerHTML = `<video id="my-video" class="video-js vjs-default-skin" controls preload="auto"></video>`;
                player = videojs('my-video');
                player.src({ src: url, type: url.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4' });
                player.play();
            }
        }

        async function playMedia(pageUrl) {
            const box = document.getElementById('player-box');
            box.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100%;color:#00d2ff;">جاري تجهيز المشغل...</div>`;

            try {
                const res = await fetch(`/api/get-player?page_url=${encodeURIComponent(pageUrl)}`);
                const data = await res.json();
                
                if (data.url) {
                    playStream(data.url, data.type === 'iframe');
                } else {
                    playStream("https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8");
                }
            } catch (e) {
                window.open(pageUrl, '_blank');
            }
        }

        function showTab(type) {
            document.getElementById('sports-sec').style.display = type === 'sports' ? 'block' : 'none';
            document.getElementById('cinema-sec').style.display = type === 'cinema' ? 'block' : 'none';
            document.getElementById('btn-sports').classList.toggle('active', type === 'sports');
            document.getElementById('btn-cinema').classList.toggle('active', type === 'cinema');
            if(type === 'sports') loadMatches(); else loadMovies();
        }

        async function loadMatches() {
            const res = await fetch('/api/matches');
            const data = await res.json();
            document.getElementById('matches-list').innerHTML = data.data.map(m => `
                <div class="match-card" onclick="playMedia('${m.match_page}')">
                    <span class="team">${m.home_team}</span>
                    <span class="status">${m.status}</span>
                    <span class="team">${m.away_team}</span>
                </div>
            `).join('');
        }

        async function loadMovies() {
            const res = await fetch('/api/movies');
            const data = await res.json();
            document.getElementById('movies-grid').innerHTML = data.data.map(m => `
                <div class="card" onclick="playMedia('${m.details_url}')">
                    <img src="${m.poster}" onerror="this.src='https://via.placeholder.com/150x220?text=No+Image'"/>
                    <h4>${m.title}</h4>
                </div>
            `).join('');
        }

        loadMatches();
    </script>
</body>
</html>
